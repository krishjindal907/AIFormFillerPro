<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineering Intern - GlobalTech Careers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; color: #1f2937; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h1 { margin-top: 0; color: #111827; }
        .form-section { margin-bottom: 30px; }
        .form-section h3 { border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 20px; color: #374151; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 500; margin-bottom: 8px; color: #4b5563; font-size: 0.95rem; }
        input[type="text"], input[type="email"], input[type="tel"], input[type="url"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box;
            font-family: inherit; font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
        .btn { background: #2563eb; color: #fff; padding: 14px 24px; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; width: 100%; }
        .btn:hover { background: #1d4ed8; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        @media (max-width: 600px) {
            .grid-2 { grid-template-columns: 1fr; }
            body { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align: center; margin-bottom: 40px;">
            <div style="font-size: 2rem; font-weight: 800; color: #2563eb; letter-spacing: -1px;">GlobalTech Inc.</div>
            <p style="color: #6b7280; margin-top: 5px;">Careers / Engineering / Internships</p>
        </div>

        <h1>Apply for: Software Engineering Intern (Summer 2026)</h1>
        <p style="color: #4b5563; margin-bottom: 30px; line-height: 1.6;">Please fill out the application below. Ensure your contact details and educational background match your resume.</p>

        <form id="application-form" onsubmit="event.preventDefault(); alert('Application Submitted! Check NeoVault Admin for Logs.'); window.close();">
            <div class="form-section">
                <h3>Personal Information</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="first_name">First Name *</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name *</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="city">City / Location</label>
                    <input type="text" id="city" name="city">
                </div>
            </div>

            <div class="form-section">
                <h3>Links & Portfolios</h3>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="linkedin">LinkedIn Profile URL</label>
                        <input type="url" id="linkedin" name="linkedin">
                    </div>
                    <div class="form-group">
                        <label for="github">GitHub Profile URL</label>
                        <input type="url" id="github" name="github">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>Education & Experience</h3>
                <div class="form-group">
                    <label for="university">University / College Name *</label>
                    <input type="text" id="university" name="university" required>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="degree">Degree / Major *</label>
                        <input type="text" id="degree" name="degree" placeholder="e.g. B.E Computer Science" required>
                    </div>
                    <div class="form-group">
                        <label for="cgpa">Current CGPA</label>
                        <input type="text" id="cgpa" name="cgpa">
                    </div>
                </div>
                <div class="form-group">
                    <label for="skills">Programming Languages & Technologies *</label>
                    <textarea id="skills" name="skills" rows="3" required placeholder="C, C++, Python, JavaScript..."></textarea>
                </div>
                <div class="form-group">
                    <label for="project">Describe your most recent project (Briefly)</label>
                    <textarea id="project" name="project" rows="3"></textarea>
                </div>
            </div>

            <button type="submit" class="btn">Submit Application</button>
        </form>
    </div>
</body>
</html>
